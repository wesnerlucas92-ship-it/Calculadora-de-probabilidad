<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>EyP WL - Calculadora de Probabilidades</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .app-card { width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    h1 { font-size: 1.2rem; color: #38bdf8; }
    .header-actions { display: flex; gap: 8px; }
    .btn-circle { background: #334155; color: #38bdf8; border: 1px solid #475569; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; }
    .btn-circle:active { background: #475569; }

    .selector-container { margin-bottom: 12px; }
    label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    
    .params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .full-col { grid-column: span 2; }

    .results { background: #0f172a; border-radius: 10px; padding: 12px; margin: 14px 0; border-left: 4px solid #38bdf8; }
    .result-main { font-size: 1.15rem; font-weight: bold; color: #38bdf8; margin-bottom: 6px; }
    .result-sub { font-size: 0.8rem; color: #94a3b8; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    
    .canvas-container { position: relative; width: 100%; }
    canvas { width: 100%; height: 210px; background: #0f172a; border-radius: 8px; touch-action: none; cursor: crosshair; }

    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(2px); justify-content: center; align-items: center; padding: 16px; z-index: 99; }
    .modal-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 440px; width: 100%; padding: 18px; max-height: 85vh; overflow-y: auto; color: #cbd5e1; }
    .modal-title { font-size: 1.1rem; color: #38bdf8; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: transparent; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; line-height: 1; }
    .modal-content p { font-size: 0.85rem; line-height: 1.45; margin-bottom: 8px; }
    
    .formula-container { 
      background: #0f172a; 
      padding: 12px; 
      border-radius: 8px; 
      margin: 6px 0 12px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow-x: auto;
      border: 1px solid #334155;
    }
    .katex { font-size: 1.05rem; color: #facc15; }
    .katex-display { margin: 0 !important; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header-row">
    <h1>EyP WL: Probabilidades</h1>
    <div class="header-actions">
      <button id="btn-install" class="btn-circle" style="display: none; background: #0284c7;" title="Instalar aplicación">📥</button>
      <button class="btn-circle" id="btn-open-about" title="Créditos e información">i</button>
      <button class="btn-circle" id="btn-open-help" title="Ver fórmulas">?</button>
    </div>
  </div>

  <div class="selector-container">
    <label for="select-dist">Distribución de Probabilidad</label>
    <select id="select-dist">
      <optgroup label="Discretas">
        <option value="binom" selected>Binomial</option>
        <option value="poisson">Poisson</option>
        <option value="nbinom">Binomial Negativa (Pascal)</option>
        <option value="geom">Geométrica</option>
        <option value="hyper">Hipergeométrica</option>
      </optgroup>
      <optgroup label="Continuas">
        <option value="normal">Normal</option>
        <option value="uniform">Uniforme Continua</option>
        <option value="expon">Exponencial</option>
        <option value="gamma">Gamma</option>
        <option value="chisq">Chi-cuadrado (χ²)</option>
        <option value="tstud">t de Student</option>
      </optgroup>
    </select>
  </div>

  <div class="params-grid" id="container-params"></div>

  <div class="params-grid" id="grid-events">
    <div id="col-op">
      <label for="select-op">Evento</label>
      <select id="select-op">
        <option value="le">P(X ≤ x)</option>
        <option value="lt">P(X &lt; x)</option>
        <option value="ge">P(X ≥ x)</option>
        <option value="gt">P(X &gt; x)</option>
        <option value="eq">P(X = x)</option>
        <option value="between">P(x₁ ≤ X ≤ x₂)</option>
      </select>
    </div>
    <div id="col-x1">
      <label for="input-x" id="label-x">Valor (x)</label>
      <input type="number" id="input-x" value="5" step="any">
    </div>
    <div id="col-x2" style="display: none;">
      <label for="input-x2">Límite sup. (x₂)</label>
      <input type="number" id="input-x2" value="9" step="any">
    </div>
  </div>

  <div class="results">
    <div id="prob-output" class="result-main">P = ...</div>
    <div class="result-sub">
      <span id="mean-output">E[X] = -</span>
      <span id="var-output">Var(X) = -</span>
      <span id="mode-output">Mo = -</span>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="modal-backdrop" id="help-modal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modal-dist-name">Distribución</span>
      <button class="modal-close" id="btn-close-help">&times;</button>
    </div>
    <div class="modal-content" id="modal-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="about-modal">
  <div class="modal-box">
    <div class="modal-title">
      <span>Acerca de la app</span>
      <button class="modal-close" id="btn-close-about">&times;</button>
    </div>
    <div class="modal-content">
      <p style="font-size: 0.95rem; color: #e2e8f0; line-height: 1.5;">
        App creada por el <strong>Prof. Wesner Lucas</strong> para la cátedra de <strong>Estadística y Probabilidad</strong> del <strong>ISFD Cecilia Braslavsky</strong>.
      </p>
    </div>
  </div>
</div>

<script>
  var INFO_DIST = {
    binom: {
      name: "Distribución Binomial",
      desc: "Número de éxitos en n pruebas de Bernoulli independientes, con probabilidad constante de éxito p y q = 1 - p.",
      formula: "b(x; n; p) = \\binom{n}{x} p^x q^{n-x} \\quad (x = 0, 1, \\dots, n)",
      moments: "\\mu = np, \\quad \\sigma^2 = npq, \\quad \\text{Mo} = \\lfloor (n+1)p \\rfloor"
    },
    poisson: {
      name: "Distribución de Poisson",
      desc: "Número de resultados que ocurren durante un intervalo continuo a tasa promedio constante λ.",
      formula: "p(x; \\lambda) = \\frac{e^{-\\lambda} \\lambda^x}{x!} \\quad (x = 0, 1, 2, \\dots)",
      moments: "\\mu = \\lambda, \\quad \\sigma^2 = \\lambda, \\quad \\text{Mo} = \\lfloor \\lambda \\rfloor"
    },
    nbinom: {
      name: "Distribución Binomial Negativa (Pascal)",
      desc: "Número de ensayos x necesarios para obtener exactamente k aciertos en procesos de Bernoulli independientes.",
      formula: "b^*(x; k; p) = \\binom{x - 1}{k - 1} p^k q^{x - k} \\quad (x = k, k+1, \\dots)",
      moments: "\\mu = \\frac{k}{p}, \\quad \\sigma^2 = \\frac{kq}{p^2}, \\quad \\text{Mo} = \\left\\lfloor \\frac{(k-1)q}{p} \\right\\rfloor + k"
    },
    geom: {
      name: "Distribución Geométrica",
      desc: "Número de pruebas x hasta obtener el primer éxito (progresión geométrica de razón q).",
      formula: "g(x; p) = p \\cdot q^{x - 1} \\quad (x = 1, 2, 3, \\dots)",
      moments: "\\mu = \\frac{1}{p}, \\quad \\sigma^2 = \\frac{q}{p^2}, \\quad \\text{Mo} = 1"
    },
    hyper: {
      name: "Distribución Hipergeométrica",
      desc: "Número de éxitos x en muestra n seleccionada SIN reemplazo de población N con k éxitos.",
      formula: "h(x; N; n; k) = \\frac{\\binom{k}{x} \\binom{N - k}{n - x}}{\\binom{N}{n}} \\quad (x = 0, 1, \\dots, n)",
      moments: "\\mu = \\frac{nk}{N}, \\quad \\sigma^2 = \\frac{N-n}{N-1} n \\frac{k}{N}\\left(1 - \\frac{k}{N}\\right), \\quad \\text{Mo} = \\left\\lfloor \\frac{(k+1)(n+1)}{N+2} \\right\\rfloor"
    },
    normal: {
      name: "Distribución Normal (Gauss)",
      desc: "Densidad continua simétrica respecto a μ con puntos de inflexión en μ ± σ.",
      formula: "n(x; \\mu; \\sigma) = \\frac{1}{\\sqrt{2\\pi}\\,\\sigma} \\, e^{-\\frac{1}{2}\\left(\\frac{x - \\mu}{\\sigma}\\right)^2} \\quad (x \\in \\mathbb{R})",
      moments: "\\mu = E[X], \\quad \\sigma^2 = \\text{Var}(X), \\quad \\text{Mo} = \\mu"
    },
    uniform: {
      name: "Distribución Uniforme Continua (Rectangular)",
      desc: "Densidad constante de base B - A y altura 1 / (B - A) sobre el intervalo [A, B].",
      formula: "f(x; A; B) = \\frac{1}{B - A} \\quad (A \\le x \\le B)",
      moments: "\\mu = \\frac{A + B}{2}, \\quad \\sigma^2 = \\frac{(B - A)^2}{12}, \\quad \\text{Mo: No única}"
    },
    expon: {
      name: "Distribución Exponencial",
      desc: "Tiempo continuo transcurrido hasta el próximo evento de un proceso de Poisson con tasa λ > 0.",
      formula: "f(x) = \\lambda e^{-\\lambda x} \\quad (x \\ge 0)",
      moments: "\\mu = \\frac{1}{\\lambda}, \\quad \\sigma^2 = \\frac{1}{\\lambda^2}, \\quad \\text{Mo} = 0"
    },
    gamma: {
      name: "Distribución Gamma",
      desc: "Modela tiempos de espera hasta la ocurrencia de α eventos en un proceso de Poisson con tasa β.",
      formula: "f(x; \\alpha, \\beta) = \\frac{\\beta^\\alpha}{\\Gamma(\\alpha)} x^{\\alpha - 1} e^{-\\beta x} \\quad (x > 0)",
      moments: "\\mu = \\frac{\\alpha}{\\beta}, \\quad \\sigma^2 = \\frac{\\alpha}{\\beta^2}, \\quad \\text{Mo} = \\frac{\\alpha - 1}{\\beta} \\; (\\alpha \\ge 1)"
    },
    chisq: {
      name: "Distribución Chi-cuadrado (χ²)",
      desc: "Distribución con ν grados de libertad. Suma de los cuadrados de ν variables normales independientes.",
      formula: "f(x; \\nu) = \\frac{1}{2^{\\nu/2} \\Gamma(\\nu/2)} x^{(\\nu/2)-1} e^{-x/2} \\quad (x > 0)",
      moments: "\\mu = \\nu, \\quad \\sigma^2 = 2\\nu, \\quad \\text{Mo} = \\max(0, \\nu - 2)"
    },
    tstud: {
      name: "Distribución t de Student",
      desc: "Cociente entre una normal estándar y la raíz de una χ² independiente dividida por sus grados de libertad ν.",
      formula: "f(t; \\nu) = \\frac{\\Gamma\\left(\\frac{\\nu+1}{2}\\right)}{\\sqrt{\\nu\\pi}\\,\\Gamma\\left(\\frac{\\nu}{2}\\right)} \\left(1 + \\frac{t^2}{\\nu}\\right)^{-\\frac{\\nu+1}{2}}",
      moments: "\\mu = 0 \\;(\\nu > 1), \\quad \\sigma^2 = \\frac{\\nu}{\\nu - 2} \\;(\\nu > 2), \\quad \\text{Mo} = 0"
    }
  };

  function getVal(id, def) {
    var el = document.getElementById(id);
    if (!el || el.value === "") return def;
    var v = parseFloat(el.value);
    return isNaN(v) ? def : v;
  }

  function logGamma(x) {
    var cof = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    var y = x, tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    var ser = 1.000000000190015;
    for (var j = 0; j <= 5; j++) ser += cof[j] / ++y;
    return -tmp + Math.log(2.5066282746310005 * ser / x);
  }

  function logFact(n) {
    if (n <= 1) return 0;
    return logGamma(n + 1);
  }

  function logComb(n, k) {
    if (k < 0 || k > n) return -Infinity;
    return logFact(n) - logFact(k) - logFact(n - k);
  }

  function erf(x) {
    var a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741;
    var a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    var sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    var t = 1.0 / (1.0 + p * x);
    var y = 1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return sign * y;
  }

  function normalCDF(x, mu, sigma) {
    return 0.5 * (1 + erf((x - mu) / (sigma * Math.sqrt(2))));
  }

  function integrateSimp(f, a, b, n) {
    if (b <= a) return 0;
    var steps = n || 60;
    if (steps % 2 !== 0) steps++;
    var h = (b - a) / steps;
    var sum = f(a) + f(b);
    for (var i = 1; i < steps; i++) {
      var x = a + i * h;
      sum += (i % 2 === 0 ? 2 : 4) * f(x);
    }
    return Math.max(0, Math.min(1, (sum * h) / 3));
  }

  function gammaPDF(x, alpha, beta) {
    if (x <= 0) return 0;
    var logNum = alpha * Math.log(beta) + (alpha - 1) * Math.log(x) - beta * x;
    var logDen = logGamma(alpha);
    return Math.exp(logNum - logDen);
  }

  function chiSqPDF(x, v) {
    if (x <= 0) return 0;
    var logNum = ((v / 2) - 1) * Math.log(x) - (x / 2);
    var logDen = (v / 2) * Math.log(2) + logGamma(v / 2);
    return Math.exp(logNum - logDen);
  }

  function tStudentPDF(t, v) {
    var logC = logGamma((v + 1) / 2) - (0.5 * Math.log(v * Math.PI) + logGamma(v / 2));
    var logBase = -((v + 1) / 2) * Math.log(1 + (t * t) / v);
    return Math.exp(logC + logBase);
  }

  function renderParamInputs() {
    var dist = document.getElementById('select-dist').value;
    var container = document.getElementById('container-params');
    var opSelect = document.getElementById('select-op');
    
    var isCont = (dist === "normal" || dist === "uniform" || dist === "expon" || dist === "gamma" || dist === "chisq" || dist === "tstud");
    if (isCont) {
      opSelect.querySelector('option[value="eq"]').text = "Densidad f(x)";
    } else {
      opSelect.querySelector('option[value="eq"]').text = "P(X = x)";
    }

    var html = "";
    if (dist === "binom") {
      html = '<div><label>Ensayos (n)</label><input type="number" id="p_n" value="20" min="1"></div>' +
             '<div><label>Probabilidad de éxito (p)</label><input type="number" id="p_p" value="0.35" min="0" max="1" step="0.01"></div>';
    } else if (dist === "poisson") {
      html = '<div class="full-col"><label>Tasa promedio (λ)</label><input type="number" id="p_lambda" value="4" min="0.001" step="0.1"></div>';
    } else if (dist === "nbinom") {
      html = '<div><label>Aciertos requeridos (k)</label><input type="number" id="p_k" value="3" min="1"></div>' +
             '<div><label>Probabilidad de éxito (p)</label><input type="number" id="p_p" value="0.4" min="0.001" max="1" step="0.01"></div>';
    } else if (dist === "geom") {
      html = '<div class="full-col"><label>Probabilidad de éxito (p)</label><input type="number" id="p_p" value="0.25" min="0.001" max="1" step="0.01"></div>';
    } else if (dist === "hyper") {
      html = '<div><label>Población total (N)</label><input type="number" id="p_N" value="50" min="1"></div>' +
             '<div><label>Éxitos en población (k)</label><input type="number" id="p_k" value="15" min="0"></div>' +
             '<div class="full-col"><label>Tamaño de muestra (n)</label><input type="number" id="p_n" value="10" min="1"></div>';
    } else if (dist === "normal") {
      html = '<div><label>Media (μ)</label><input type="number" id="p_mu" value="0" step="any"></div>' +
             '<div><label>Desvío estándar (σ)</label><input type="number" id="p_sigma" value="1" min="0.001" step="any"></div>';
    } else if (dist === "uniform") {
      html = '<div><label>Límite inferior (A)</label><input type="number" id="p_A" value="0" step="any"></div>' +
             '<div><label>Límite superior (B)</label><input type="number" id="p_B" value="10" step="any"></div>';
    } else if (dist === "expon") {
      html = '<div class="full-col"><label>Tasa (λ)</label><input type="number" id="p_lambda" value="1.5" min="0.001" step="any"></div>';
    } else if (dist === "gamma") {
      html = '<div><label>Forma (α)</label><input type="number" id="p_alpha" value="3" min="0.1" step="0.5"></div>' +
             '<div><label>Tasa (β)</label><input type="number" id="p_beta" value="1" min="0.001" step="0.2"></div>';
    } else if (dist === "chisq") {
      html = '<div class="full-col"><label>Grados de libertad (ν)</label><input type="number" id="p_nu" value="5" min="1" step="1"></div>';
    } else if (dist === "tstud") {
      html = '<div class="full-col"><label>Grados de libertad (ν)</label><input type="number" id="p_nu_t" value="10" min="1" step="1"></div>';
    }
    container.innerHTML = html;
  }

  function updateEventUI() {
    var op = document.getElementById('select-op').value;
    var colOp = document.getElementById('col-op');
    var colX2 = document.getElementById('col-x2');
    var labelX = document.getElementById('label-x');
    var grid = document.getElementById('grid-events');

    if (op === "between") {
      grid.style.gridTemplateColumns = "1fr 1fr 1fr";
      colOp.style.gridColumn = "span 1";
      colX2.style.display = "block";
      labelX.innerText = "Límite inf. (x₁)";
    } else {
      grid.style.gridTemplateColumns = "1fr 1fr";
      colOp.style.gridColumn = "span 1";
      colX2.style.display = "none";
      labelX.innerText = "Valor (x)";
    }
  }

  var currentChartState = null;

  function evalCond(val, target, op, target2) {
    if (op === 'between') {
      var low = Math.min(target, target2);
      var high = Math.max(target, target2);
      return val >= low && val <= high;
    }
    if (op === 'eq') return Math.abs(val - target) < 1e-5;
    if (op === 'le') return val <= target;
    if (op === 'ge') return val >= target;
    if (op === 'lt') return val < target;
    if (op === 'gt') return val > target;
    return false;
  }

  function calculate(isParamChange) {
    var dist = document.getElementById('select-dist').value;
    var op = document.getElementById('select-op').value;
    var x = getVal('input-x', 0);
    var x2 = getVal('input-x2', 0);

    var prob = 0, mean = 0, variance = 0, mode = "-", sd = 1;
    var isDiscrete = !(dist === "normal" || dist === "uniform" || dist === "expon" || dist === "gamma" || dist === "chisq" || dist === "tstud");
    var chartData = { type: isDiscrete ? 'discrete' : 'continuous', points: [], minX: 0, maxX: 1 };
    var extraParams = {};

    if (dist === "binom") {
      var n = Math.max(1, Math.round(getVal('p_n', 20)));
      var p = Math.max(0, Math.min(1, getVal('p_p', 0.35)));
      var q = 1 - p;
      mean = n * p;
      variance = n * p * q;
      mode = Math.floor((n + 1) * p);
      sd = Math.sqrt(Math.max(variance, 0.001));

      var winMin = Math.max(0, Math.floor(mean - 3.5 * sd));
      var winMax = Math.min(n, Math.ceil(mean + 3.5 * sd));
      if (winMax - winMin < 8) {
        winMin = Math.max(0, Math.floor(mean - 4));
        winMax = Math.min(n, Math.ceil(mean + 4));
      }

      if (isParamChange && (x < winMin || x > winMax)) {
        x = Math.max(0, Math.round(mean - sd));
        x2 = Math.min(n, Math.round(mean + sd));
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = winMin;
      chartData.maxX = winMax;

      for (var k = 0; k <= n; k++) {
        var p_k = Math.exp(logComb(n, k) + k * Math.log(p || 1e-10) + (n - k) * Math.log(q || 1e-10));
        if (evalCond(k, x, op, x2)) prob += p_k;
        if (k >= winMin && k <= winMax) {
          chartData.points.push({ x: k, y: p_k });
        }
      }
    } 
    else if (dist === "poisson") {
      var l = Math.max(0.001, getVal('p_lambda', 4));
      mean = l;
      variance = l;
      mode = Math.floor(l);
      sd = Math.sqrt(l);

      var winMinP = Math.max(0, Math.floor(mean - 3.5 * sd));
      var winMaxP = Math.ceil(mean + 3.5 * sd);
      if (winMaxP - winMinP < 8) winMaxP = winMinP + 8;

      if (isParamChange && (x < winMinP || x > winMaxP)) {
        x = Math.max(0, Math.round(mean - sd));
        x2 = Math.round(mean + sd);
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      var evalMax = Math.max(winMaxP + 20, Math.ceil(l + 6 * sd));
      chartData.minX = winMinP;
      chartData.maxX = winMaxP;

      for (var k2 = 0; k2 <= evalMax; k2++) {
        var p_k2 = Math.exp(-l + k2 * Math.log(l) - logFact(k2));
        if (evalCond(k2, x, op, x2)) prob += p_k2;
        if (k2 >= winMinP && k2 <= winMaxP) {
          chartData.points.push({ x: k2, y: p_k2 });
        }
      }
    }
    else if (dist === "nbinom") {
      var kTarget = Math.max(1, Math.round(getVal('p_k', 3)));
      var pn = Math.max(0.001, Math.min(1, getVal('p_p', 0.4)));
      var qn = 1 - pn;
      mean = kTarget / pn;
      variance = (kTarget * qn) / (pn * pn);
      mode = Math.floor(((kTarget - 1) * qn) / pn) + kTarget;
      sd = Math.sqrt(variance);

      var winMinNb = Math.max(kTarget, Math.floor(mean - 3.5 * sd));
      var winMaxNb = Math.ceil(mean + 3.5 * sd);
      if (winMaxNb - winMinNb < 8) winMaxNb = winMinNb + 8;

      if (isParamChange && (x < winMinNb || x > winMaxNb)) {
        x = Math.max(kTarget, Math.round(mean - sd));
        x2 = Math.round(mean + sd);
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      var evalMaxNb = Math.max(winMaxNb + 25, Math.ceil(mean + 6 * sd));
      chartData.minX = winMinNb;
      chartData.maxX = winMaxNb;

      for (var t = kTarget; t <= evalMaxNb; t++) {
        var p_t = Math.exp(logComb(t - 1, kTarget - 1) + kTarget * Math.log(pn) + (t - kTarget) * Math.log(qn));
        if (evalCond(t, x, op, x2)) prob += p_t;
        if (t >= winMinNb && t <= winMaxNb) {
          chartData.points.push({ x: t, y: p_t });
        }
      }
    }
    else if (dist === "geom") {
      var pg = Math.max(0.001, Math.min(1, getVal('p_p', 0.25)));
      var qg = 1 - pg;
      mean = 1 / pg;
      variance = qg / (pg * pg);
      mode = 1;
      sd = Math.sqrt(variance);

      var winMinG = 1;
      var winMaxG = Math.ceil(mean + 3.5 * sd);
      if (winMaxG < 8) winMaxG = 8;

      if (isParamChange && (x < winMinG || x > winMaxG)) {
        x = 1;
        x2 = Math.round(mean + sd);
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      var evalMaxG = Math.max(winMaxG + 20, Math.ceil(mean + 6 * sd));
      chartData.minX = winMinG;
      chartData.maxX = winMaxG;

      for (var t2 = 1; t2 <= evalMaxG; t2++) {
        var p_t2 = pg * Math.pow(qg, t2 - 1);
        if (evalCond(t2, x, op, x2)) prob += p_t2;
        if (t2 >= winMinG && t2 <= winMaxG) {
          chartData.points.push({ x: t2, y: p_t2 });
        }
      }
    }
    else if (dist === "hyper") {
      var N = Math.max(1, Math.round(getVal('p_N', 50)));
      var kSucc = Math.max(0, Math.min(N, Math.round(getVal('p_k', 15))));
      var nh = Math.max(1, Math.min(N, Math.round(getVal('p_n', 10))));
      mean = (nh * kSucc) / N;
      variance = ((N - nh) / (N - 1 || 1)) * nh * (kSucc / N) * (1 - kSucc / N);
      mode = Math.floor(((kSucc + 1) * (nh + 1)) / (N + 2));
      sd = Math.sqrt(Math.max(variance, 0.001));

      var minKh = Math.max(0, nh - (N - kSucc));
      var maxKh = Math.min(nh, kSucc);

      var winMinH = Math.max(minKh, Math.floor(mean - 3.5 * sd));
      var winMaxH = Math.min(maxKh, Math.ceil(mean + 3.5 * sd));
      if (winMaxH - winMinH < 6) {
        winMinH = minKh;
        winMaxH = maxKh;
      }

      if (isParamChange && (x < winMinH || x > winMaxH)) {
        x = Math.max(minKh, Math.round(mean - sd));
        x2 = Math.min(maxKh, Math.round(mean + sd));
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = winMinH;
      chartData.maxX = winMaxH;

      for (var s = minKh; s <= maxKh; s++) {
        var p_s = Math.exp(logComb(kSucc, s) + logComb(N - kSucc, nh - s) - logComb(N, nh));
        if (evalCond(s, x, op, x2)) prob += p_s;
        if (s >= winMinH && s <= winMaxH) {
          chartData.points.push({ x: s, y: p_s });
        }
      }
    }
    else if (dist === "normal") {
      var mu = getVal('p_mu', 0);
      var sigma = Math.max(0.001, getVal('p_sigma', 1));
      mean = mu;
      variance = sigma * sigma;
      mode = mu.toFixed(2);

      if (op === "between") {
        var lowN = Math.min(x, x2), highN = Math.max(x, x2);
        prob = normalCDF(highN, mu, sigma) - normalCDF(lowN, mu, sigma);
      } else {
        var cdf = normalCDF(x, mu, sigma);
        if (op === "le" || op === "lt") prob = cdf;
        else if (op === "ge" || op === "gt") prob = 1 - cdf;
        else prob = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mu) / sigma, 2));
      }

      var winMinNorm = mu - 3.5 * sigma;
      var winMaxNorm = mu + 3.5 * sigma;

      if (isParamChange && (x < winMinNorm || x > winMaxNorm)) {
        x = parseFloat((mu - sigma).toFixed(2));
        x2 = parseFloat((mu + sigma).toFixed(2));
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = winMinNorm;
      chartData.maxX = winMaxNorm;
      var step = (chartData.maxX - chartData.minX) / 140;
      for (var v = chartData.minX; v <= chartData.maxX; v += step) {
        var density = (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((v - mu) / sigma, 2));
        chartData.points.push({ x: v, y: density });
      }
    }
    else if (dist === "uniform") {
      var A = getVal('p_A', 0);
      var B = getVal('p_B', 10);
      if (B <= A) B = A + 1;
      mean = (A + B) / 2;
      variance = Math.pow(B - A, 2) / 12;
      mode = "No única";
      extraParams = { A: A, B: B };

      var getUnifCDF = function(val) {
        if (val < A) return 0;
        if (val > B) return 1;
        return (val - A) / (B - A);
      };

      if (op === "between") {
        var lowU = Math.min(x, x2), highU = Math.max(x, x2);
        prob = getUnifCDF(highU) - getUnifCDF(lowU);
      } else if (op === "le" || op === "lt") {
        prob = getUnifCDF(x);
      } else if (op === "ge" || op === "gt") {
        prob = 1 - getUnifCDF(x);
      } else {
        prob = (x >= A && x <= B) ? (1 / (B - A)) : 0;
      }

      if (isParamChange && (x < A || x > B)) {
        x = parseFloat((A + (B - A) * 0.25).toFixed(2));
        x2 = parseFloat((A + (B - A) * 0.75).toFixed(2));
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      var h_dens = 1 / (B - A);
      var span = B - A;
      chartData.minX = A - span * 0.15;
      chartData.maxX = B + span * 0.15;

      chartData.points = [
        { x: chartData.minX, y: 0 },
        { x: A, y: 0 },
        { x: A, y: h_dens },
        { x: B, y: h_dens },
        { x: B, y: 0 },
        { x: chartData.maxX, y: 0 }
      ];
    }
    else if (dist === "expon") {
      var le = Math.max(0.001, getVal('p_lambda', 1.5));
      mean = 1 / le;
      variance = 1 / (le * le);
      mode = 0;

      var getExpCDF = function(val) { return val <= 0 ? 0 : (1 - Math.exp(-le * val)); };

      if (op === "between") {
        var lowE = Math.min(x, x2), highE = Math.max(x, x2);
        prob = getExpCDF(highE) - getExpCDF(lowE);
      } else if (op === "le" || op === "lt") {
        prob = getExpCDF(x);
      } else if (op === "ge" || op === "gt") {
        prob = 1 - getExpCDF(x);
      } else {
        prob = x < 0 ? 0 : (le * Math.exp(-le * x));
      }

      var winMaxExpon = 4.0 / le;
      if (isParamChange && (x < 0 || x > winMaxExpon)) {
        x = parseFloat((0.5 / le).toFixed(2));
        x2 = parseFloat((2.0 / le).toFixed(2));
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = 0;
      chartData.maxX = winMaxExpon;
      var stepe = chartData.maxX / 140;
      for (var ve = 0; ve <= chartData.maxX; ve += stepe) {
        chartData.points.push({ x: ve, y: le * Math.exp(-le * ve) });
      }
    }
    else if (dist === "gamma") {
      var alpha = Math.max(0.1, getVal('p_alpha', 3));
      var beta = Math.max(0.001, getVal('p_beta', 1));
      mean = alpha / beta;
      variance = alpha / (beta * beta);
      mode = alpha >= 1 ? ((alpha - 1) / beta).toFixed(2) : 0;
      sd = Math.sqrt(variance);

      var pdfGamma = function(val) { return gammaPDF(val, alpha, beta); };
      if (op === "between") {
        var lowG = Math.max(1e-4, Math.min(x, x2)), highG = Math.max(1e-4, Math.max(x, x2));
        prob = integrateSimp(pdfGamma, lowG, highG, 80);
      } else if (op === "eq") {
        prob = pdfGamma(x);
      } else {
        var cdfG = (x <= 0) ? 0 : integrateSimp(pdfGamma, 1e-4, x, 80);
        if (op === "le" || op === "lt") prob = cdfG;
        else prob = 1 - cdfG;
      }

      var winMaxG = Math.max(mean + 3.8 * sd, 4 / beta);
      if (isParamChange && (x < 0 || x > winMaxG)) {
        x = parseFloat(Math.max(0, mean - sd).toFixed(2));
        x2 = parseFloat((mean + sd).toFixed(2));
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = 0;
      chartData.maxX = winMaxG;
      var stepG = chartData.maxX / 140;
      for (var vg = 0; vg <= chartData.maxX; vg += stepG) {
        chartData.points.push({ x: vg, y: pdfGamma(vg) });
      }
    }
    else if (dist === "chisq") {
      var nu = Math.max(1, Math.round(getVal('p_nu', 5)));
      mean = nu;
      variance = 2 * nu;
      mode = nu >= 2 ? (nu - 2) : 0;
      sd = Math.sqrt(variance);

      var pdfChi = function(val) { return chiSqPDF(val, nu); };
      if (op === "between") {
        var lowC = Math.max(1e-4, Math.min(x, x2)), highC = Math.max(1e-4, Math.max(x, x2));
        prob = integrateSimp(pdfChi, lowC, highC, 80);
      } else if (op === "eq") {
        prob = pdfChi(x);
      } else {
        var cdfChi = (x <= 0) ? 0 : integrateSimp(pdfChi, 1e-4, x, 80);
        if (op === "le" || op === "lt") prob = cdfChi;
        else prob = 1 - cdfChi;
      }

      var winMaxChi = Math.max(nu + 3.8 * sd, 8);
      if (isParamChange && (x < 0 || x > winMaxChi)) {
        x = Math.max(0, Math.round(mean - sd));
        x2 = Math.round(mean + sd);
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = 0;
      chartData.maxX = winMaxChi;
      var stepChi = chartData.maxX / 140;
      for (var vc = 0; vc <= chartData.maxX; vc += stepChi) {
        chartData.points.push({ x: vc, y: pdfChi(vc) });
      }
    }
    else if (dist === "tstud") {
      var nuT = Math.max(1, Math.round(getVal('p_nu_t', 10)));
      mean = nuT > 1 ? 0 : "Indet.";
      variance = nuT > 2 ? (nuT / (nuT - 2)) : (nuT > 1 ? "∞" : "Indet.");
      mode = 0;
      var effSD = (nuT > 2) ? Math.sqrt(nuT / (nuT - 2)) : 1.5;

      var pdfT = function(val) { return tStudentPDF(val, nuT); };
      var getTCDF = function(val) {
        var winB = 5 * effSD;
        if (val <= -winB) return 0;
        if (val >= winB) return 1;
        if (val < 0) return 0.5 - integrateSimp(pdfT, val, 0, 80);
        return 0.5 + integrateSimp(pdfT, 0, val, 80);
      };

      if (op === "between") {
        var lowT = Math.min(x, x2), highT = Math.max(x, x2);
        prob = getTCDF(highT) - getTCDF(lowT);
      } else if (op === "eq") {
        prob = pdfT(x);
      } else if (op === "le" || op === "lt") {
        prob = getTCDF(x);
      } else {
        prob = 1 - getTCDF(x);
      }

      var winMaxT = 3.8 * effSD;
      if (isParamChange && (x < -winMaxT || x > winMaxT)) {
        x = -1;
        x2 = 1;
        document.getElementById('input-x').value = x;
        document.getElementById('input-x2').value = x2;
      }

      chartData.minX = -winMaxT;
      chartData.maxX = winMaxT;
      var stepT = (2 * winMaxT) / 140;
      for (var vt = -winMaxT; vt <= winMaxT; vt += stepT) {
        chartData.points.push({ x: vt, y: pdfT(vt) });
      }
    }

    if (op === "between") {
      var minVal = Math.min(x, x2);
      var maxVal = Math.max(x, x2);
      document.getElementById('prob-output').innerText = "P(" + minVal + " ≤ X ≤ " + maxVal + ") = " + prob.toFixed(5);
    } else {
      var opSym = { eq: '=', le: '≤', ge: '≥', lt: '<', gt: '>' }[op];
      document.getElementById('prob-output').innerText = (isDiscrete || op !== 'eq') 
        ? "P(X " + opSym + " " + x + ") = " + prob.toFixed(5)
        : "f(" + x + ") = " + prob.toFixed(5);
    }
    
    document.getElementById('mean-output').innerText = "E[X] = " + (typeof mean === "number" ? mean.toFixed(2) : mean);
    document.getElementById('var-output').innerText = "Var(X) = " + (typeof variance === "number" ? variance.toFixed(2) : variance);
    document.getElementById('mode-output').innerText = "Mo = " + mode;

    draw(chartData, x, op, isDiscrete, dist, extraParams, x2);
  }

  function draw(data, targetX, op, isDiscrete, distKey, extraParams, targetX2) {
    var canvas = document.getElementById('chart');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);

    var w = canvas.clientWidth;
    var h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    if (!data.points || data.points.length === 0) return;

    var padLeft = 46;
    var padRight = 18;
    var padTop = 18;
    var padBottom = 34;

    var plotW = w - padLeft - padRight;
    var plotH = h - padTop - padBottom;

    var maxY = 0.001;
    for (var i = 0; i < data.points.length; i++) {
      if (data.points[i].y > maxY) maxY = data.points[i].y;
    }
    maxY *= 1.18;

    var minX = data.minX;
    var maxX = data.maxX;
    if (maxX === minX) maxX = minX + 1;

    var mapX = function(vx) { return padLeft + ((vx - minX) / (maxX - minX)) * plotW; };
    var mapY = function(vy) { return padTop + plotH - (vy / maxY) * plotH; };

    currentChartState = { isDiscrete: isDiscrete, minX: minX, maxX: maxX, padLeft: padLeft, plotW: plotW };

    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, padTop);
    ctx.lineTo(padLeft, padTop + plotH);
    ctx.lineTo(padLeft + plotW, padTop + plotH);
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    var yVals = [0, maxY / 2, maxY];
    for (var j = 0; j < yVals.length; j++) {
      var yCoord = mapY(yVals[j]);
      ctx.beginPath();
      ctx.moveTo(padLeft - 4, yCoord);
      ctx.lineTo(padLeft, yCoord);
      ctx.stroke();
      ctx.fillText(yVals[j].toFixed(2), padLeft - 6, yCoord);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var xVals = [
      minX,
      minX + (maxX - minX) * 0.25,
      (minX + maxX) / 2,
      minX + (maxX - minX) * 0.75,
      maxX
    ];
    for (var k = 0; k < xVals.length; k++) {
      var xCoord = mapX(xVals[k]);
      ctx.beginPath();
      ctx.moveTo(xCoord, padTop + plotH);
      ctx.lineTo(xCoord, padTop + plotH + 4);
      ctx.stroke();
      ctx.fillText(Number(xVals[k].toFixed(isDiscrete ? 0 : 1)), xCoord, padTop + plotH + 6);
    }

    if (isDiscrete) {
      var totalPts = data.points.length;
      var barW = plotW / Math.max(totalPts, 1);

      for (var idx = 0; idx < data.points.length; idx++) {
        var pt = data.points[idx];
        var barH = (pt.y / maxY) * plotH;
        var bx = mapX(pt.x) - barW / 2;
        var by = padTop + plotH - barH;

        ctx.fillStyle = evalCond(pt.x, targetX, op, targetX2) ? '#38bdf8' : '#334155';
        ctx.fillRect(Math.max(bx, padLeft), by, Math.max(barW - 1, 1.5), barH);
      }
    } else {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';

      if (distKey === "uniform") {
        var A = extraParams.A !== undefined ? extraParams.A : 0;
        var B = extraParams.B !== undefined ? extraParams.B : 10;
        var h_dens = 1 / (B - A);

        var shadeLeft = A, shadeRight = B;
        if (op === "between") {
          shadeLeft = Math.max(A, Math.min(targetX, targetX2));
          shadeRight = Math.min(B, Math.max(targetX, targetX2));
        } else if (op === "le" || op === "lt") {
          shadeLeft = A;
          shadeRight = Math.min(Math.max(targetX, A), B);
        } else if (op === "ge" || op === "gt") {
          shadeLeft = Math.min(Math.max(targetX, A), B);
          shadeRight = B;
        }

        if (shadeRight > shadeLeft && op !== "eq") {
          var sx1 = mapX(shadeLeft);
          var sx2 = mapX(shadeRight);
          var syTop = mapY(h_dens);
          var syBase = mapY(0);
          ctx.fillRect(sx1, syTop, sx2 - sx1, syBase - syTop);
        }
      } else {
        ctx.beginPath();
        var started = false;
        for (var idx2 = 0; idx2 < data.points.length; idx2++) {
          var pt2 = data.points[idx2];
          if (evalCond(pt2.x, targetX, op, targetX2)) {
            if (!started) {
              ctx.moveTo(mapX(pt2.x), mapY(0));
              started = true;
            }
            ctx.lineTo(mapX(pt2.x), mapY(pt2.y));
          } else if (started) {
            ctx.lineTo(mapX(pt2.x), mapY(0));
            started = false;
          }
        }
        if (started) {
          ctx.lineTo(mapX(data.points[data.points.length - 1].x), mapY(0));
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.beginPath();
      ctx.moveTo(mapX(data.points[0].x), mapY(data.points[0].y));
      for (var idx3 = 1; idx3 < data.points.length; idx3++) {
        ctx.lineTo(mapX(data.points[idx3].x), mapY(data.points[idx3].y));
      }
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Dibujo de líneas de referencia punteadas
    var drawDashedMarker = function(val) {
      if (val >= minX && val <= maxX) {
        var px = mapX(val);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(px, padTop);
        ctx.lineTo(px, padTop + plotH);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    };

    if (op === "between") {
      drawDashedMarker(targetX);
      drawDashedMarker(targetX2);
    } else {
      drawDashedMarker(targetX);
    }
  }

  function handleCanvasPointer(e) {
    if (!currentChartState) return;
    var canvas = document.getElementById('chart');
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clickX = clientX - rect.left;

    var isDiscrete = currentChartState.isDiscrete;
    var minX = currentChartState.minX;
    var maxX = currentChartState.maxX;
    var padLeft = currentChartState.padLeft;
    var plotW = currentChartState.plotW;

    if (clickX < padLeft || clickX > padLeft + plotW) return;

    var ratio = (clickX - padLeft) / plotW;
    var selectedVal = minX + ratio * (maxX - minX);

    if (isDiscrete) {
      selectedVal = Math.round(selectedVal);
    } else {
      selectedVal = parseFloat(selectedVal.toFixed(2));
    }

    var op = document.getElementById('select-op').value;
    if (op === "between") {
      var x1 = getVal('input-x', 0);
      var x2 = getVal('input-x2', 0);
      // Mueve el límite más cercano al punto donde se tocó
      if (Math.abs(selectedVal - x1) <= Math.abs(selectedVal - x2)) {
        document.getElementById('input-x').value = selectedVal;
      } else {
        document.getElementById('input-x2').value = selectedVal;
      }
    } else {
      document.getElementById('input-x').value = selectedVal;
    }
    calculate(false);
  }

  var canvasEl = document.getElementById('chart');
  canvasEl.addEventListener('click', handleCanvasPointer);
  canvasEl.addEventListener('touchmove', function(e) {
    handleCanvasPointer(e);
    e.preventDefault();
  }, { passive: false });

  var helpModal = document.getElementById('help-modal');
  var aboutModal = document.getElementById('about-modal');

  document.getElementById('btn-open-help').onclick = function() {
    var dist = document.getElementById('select-dist').value;
    var info = INFO_DIST[dist];
    document.getElementById('modal-dist-name').innerText = info.name;
    document.getElementById('modal-body').innerHTML = 
      '<p><strong>¿Qué calcula?</strong><br>' + info.desc + '</p>' +
      '<label>Función de masa / densidad:</label>' +
      '<div class="formula-container" id="formula-katex"></div>' +
      '<label>Parámetros centrales (Esperanza, Varianza y Moda):</label>' +
      '<div class="formula-container" id="moments-katex"></div>';

    if (window.katex) {
      katex.render(info.formula, document.getElementById('formula-katex'), { displayMode: true, throwOnError: false });
      katex.render(info.moments, document.getElementById('moments-katex'), { displayMode: true, throwOnError: false });
    }
    helpModal.style.display = 'flex';
  };

  document.getElementById('btn-close-help').onclick = function() { helpModal.style.display = 'none'; };

  document.getElementById('btn-open-about').onclick = function() {
    aboutModal.style.display = 'flex';
  };
  document.getElementById('btn-close-about').onclick = function() { aboutModal.style.display = 'none'; };

  window.onclick = function(e) {
    if (e.target === helpModal) helpModal.style.display = 'none';
    if (e.target === aboutModal) aboutModal.style.display = 'none';
  };

  document.getElementById('select-dist').addEventListener('change', function() {
    renderParamInputs();
    calculate(true);
  });

  document.getElementById('select-op').addEventListener('change', function() {
    updateEventUI();
    calculate(false);
  });

  document.addEventListener('input', function(e) {
    if (e.target && (e.target.matches('input') || e.target.matches('select'))) {
      var isParam = (e.target.id !== 'input-x' && e.target.id !== 'input-x2' && e.target.id !== 'select-op');
      calculate(isParam);
    }
  });

  // Prompt nativo para instalación PWA en Android
  var deferredPrompt;
  var btnInstall = document.getElementById('btn-install');

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (btnInstall) btnInstall.style.display = 'flex';
  });

  if (btnInstall) {
    btnInstall.addEventListener('click', function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choiceResult) {
        if (choiceResult.outcome === 'accepted') {
          btnInstall.style.display = 'none';
        }
        deferredPrompt = null;
      });
    });
  }

  window.addEventListener('appinstalled', function() {
    if (btnInstall) btnInstall.style.display = 'none';
    deferredPrompt = null;
  });

  try {
    renderParamInputs();
    updateEventUI();
    calculate(true);
  } catch (err) {
    console.error("Error al iniciar:", err);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
